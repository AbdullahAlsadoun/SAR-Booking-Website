  <div class="container">
    <h1>Create Account</h1>
    <form action="register_process.php" method="post" id="registerForm">
      <label>Full Name</label>
      <input type="text" name="name" required pattern="[A-Za-z\s]{3,50}" title="Letters only, 3-50 chars">

      <label>ID</label>
      <input type="text" name="id" required pattern="[0-9]{10}" title="10 digits">

      <label>Date of Birth</label>
      <input type="date" name="dob" required>

      <label>Nationality</label>
      <input type="text" name="nationality" required>

      <label>Mobile Number</label>
      <input type="tel" name="mobile" required pattern="05[0-9]{8}" title="e.g. 05xxxxxxxx">

      <label>Email Address</label>
      <input type="email" name="email" required>

      <label>Password</label>
      <input type="password" id="password" name="password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Password must contain at least 1 number, 1 uppercase letter, and be at least 8 characters long.">

      <label>Confirm Password</label>
      <input type="password" id="confirm_password" name="confirm_password" required minlength="8" pattern="(?=.*\d)(?=.*[A-Z]).{8,}" title="Should match the password above">
      <br><br>
      <label>Security Check:</label>
      <div>
        <span id="captchaDisplay" class="captcha-box"></span>
        <button type="button" id="refreshCaptcha">🔄 Refresh</button>
      </div>
        <br>

      <label for="captchaInput">Type the characters you see above :</label>
      <input type="text" id="captchaInput" required autocomplete="off">
      <br><br>

      <button type="submit">Register</button>
    </form>

    <script src="register.js"></script>
