  <div class="container">
    <h1>Book a Ticket</h1>
    <form action="" method="post" id="bookingForm">
      <div>
        <label><input type="radio" name="trip" value="one" checked> One Way Trip</label>
        <label><input type="radio" name="trip" value="round"> Round Trip</label>
        <label><input type="radio" name="trip" value="multi"> Multi Route</label>
        <br><br>
      </div>
      
      <div class="booking-row">
        <div>
          <label>From</label>
          <select name="from" required>
            <option value="">Select Departure</option>
            <option>Riyadh</option>
            <option>Makkah</option>
            <option>Madinah</option>
            <option>Dammam</option>
            <option>Jeddah</option>
          </select>
        </div>
        <div>
          <label>To</label>
          <select name="to" required>
            <option value="">Select Arrival</option>
            <option>Riyadh</option>
            <option>Makkah</option>
            <option>Madinah</option>
            <option>Dammam</option>
            <option>Jeddah</option>
          </select>
        </div>
        <div>
          <label>Departure Date</label>
          <input type="date" id="departure_date" name="date" required>
        </div>
        <div>
          <label>Travelers</label>
          <select name="travelers" id="traveler_select" required>
            <option value="1">1 Traveler</option>
            <option value="2">2 Travelers</option>
            <option value="3">3 Travelers</option>
            <option value="4">4 Travelers</option>
            <option value="12">12 Travelers (Group)</option>
            <option value="15">15 Travelers (Group)</option>
          </select>
          <br><br><br>
          <label style="float:right;"><input type="checkbox" id="group_checkbox" name="group"><br>Coupon Booking <br>(More than 10 passengers)</label>
        </div>
      </div>
      
      <p style="text-align:right;margin-top:15px;">
        <a href="https://sar.hhr.sa/timetable">📅 Haramain Train Time Table</a>
      </p>
      
      <button type="submit" style="float:right;">Search</button>
      <div style="clear:both;"></div>
    </form>
    
    <script src="booking.js"></script>
  </div>
